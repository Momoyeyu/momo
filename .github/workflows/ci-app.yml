name: Application checks
on:
  push:
    branches: [master]
    paths: ['app/**', '.github/workflows/ci-app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/ci-app.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock
      - run: uv sync --frozen
        working-directory: app/backend
      - run: uv run --frozen pytest -q
        working-directory: app/backend
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: app/frontend
      - run: python3 app/scripts/prepare-core.py
      - run: pnpm typecheck && pnpm test && pnpm build
        working-directory: app/frontend
