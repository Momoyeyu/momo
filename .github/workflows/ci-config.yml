name: ci-config

# app/.env.example 漂移门禁：schema（config.schema.toml）与校验器
# （momoctl config check）都在 momo-infra 仓——checkout 后构建 momoctl，
# 组一个最小 check root（schema + 本仓持有的 app/.env.example）跑校验；
# root 下不存在的来源记 skip 不计漂移（拆仓口径，momo-infra config.md §6）。
# config.md 全集文档在 momo-infra 仓由其 ci-config.yml 校验；本仓
# docs/01-architecture/config.md 是收窄的 app 面文档，非全集 schema 检查对象。

on:
  push:
    branches: [master]
    paths:
      - 'app/.env.example'
      - '.github/workflows/ci-config.yml'
  pull_request:
    paths:
      - 'app/.env.example'
      - '.github/workflows/ci-config.yml'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Momoyeyu/momo-infra
          path: momo-infra
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: momo-infra/infra
      - name: build momoctl
        run: cargo build --manifest-path momo-infra/infra/Cargo.toml --bin momoctl
      - name: assemble check root
        run: |
          ROOT="$RUNNER_TEMP/momo-config-check"
          mkdir -p "$ROOT/app"
          cp momo-infra/config.schema.toml "$ROOT/config.schema.toml"
          cp app/.env.example "$ROOT/app/.env.example"
      - name: momoctl config check
        run: momo-infra/infra/target/debug/momoctl config check --root "$RUNNER_TEMP/momo-config-check"
