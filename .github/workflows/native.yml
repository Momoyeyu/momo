name: Electron macOS candidate
on:
  workflow_dispatch:
    inputs:
      qq_archive_url:
        description: Reviewed resource-only QQ tar.gz URL (resources/ and manifest.json)
        required: true
        type: string
      qq_archive_sha256:
        description: SHA-256 of that archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: app/frontend
      - run: uv sync --frozen
        working-directory: app/backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon build
        working-directory: app/plugin-host/minecraft-fabric
      - name: Retrieve reviewed QQ resources
        env:
          QQ_ARCHIVE_URL: ${{ inputs.qq_archive_url }}
          QQ_ARCHIVE_SHA256: ${{ inputs.qq_archive_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, tarfile, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'momo-qq'
          target.mkdir()
          archive = target / 'bundle.tar.gz'
          urllib.request.urlretrieve(os.environ['QQ_ARCHIVE_URL'], archive)
          if hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() != os.environ['QQ_ARCHIVE_SHA256']:
              raise SystemExit('QQ archive checksum mismatch')
          with tarfile.open(archive) as package:
              package.extractall(target, filter='data')
          PYTHON
      - name: Prepare pinned offline resources
        run: |
          uv run --project app/backend --frozen python app/backend/scripts/download_asr_models.py
          uv run --project app/backend --frozen --with huggingface-hub==2.2.0 python app/backend/scripts/prepare_embedding.py
          uv run --project app/backend --frozen python app/backend/scripts/package_resources.py --output app/dist/momo-resources.zip
          uv run --project app/backend --frozen python app/scripts/prepare-models.py app/dist/momo-resources.zip
          python3 app/scripts/prepare-core.py
          python3 app/scripts/prepare-plugin-runtime.py
          python3 app/scripts/prepare-qq-bundle.py --resources "$RUNNER_TEMP/momo-qq/resources" --manifest "$RUNNER_TEMP/momo-qq/manifest.json"
      - run: uv pip install --python app/backend/.venv pyinstaller==6.20.0
      - run: python3 app/scripts/freeze-backend.py
      - run: node app/scripts/frontend.mjs build
      - run: pnpm test:shell && pnpm build:macos
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: momo-macos-arm64-unsigned-candidate
          path: app/out/make/
          if-no-files-found: error
