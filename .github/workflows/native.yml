name: Native installers
# Build candidate artifacts without publishing a release or signing credentials.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Validated macOS arm64 candidate; Windows is a separate follow-up'
        type: choice
        default: macos-15
        options:
          - macos-15
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the validated macOS arm64 runner
        shell: bash
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 || {
            echo 'This candidate packages a pinned macOS arm64 Node runtime; use a macOS arm64 runner.' >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: app/backend/.python-version
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            app/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: app/frontend
      - run: uv sync --frozen
        working-directory: app/backend
      - name: Prepare pinned bundled Node and Cordis runtime
        run: uv run --project app/backend --frozen python app/scripts/prepare-plugin-host.py
      - name: Prepare fixed offline resources
        shell: bash
        run: |
          uv run --project app/backend --frozen python app/backend/scripts/download_asr_models.py
          uv run --project app/backend --frozen --with huggingface-hub==2.2.0 python app/backend/scripts/prepare_embedding.py
          uv run --project app/backend --frozen python app/backend/scripts/package_resources.py --output app/dist/momo-resources.zip
          uv run --project app/backend --frozen python app/scripts/prepare-models.py app/dist/momo-resources.zip
          uv run --project app/backend --frozen python app/scripts/prepare-core.py
      - name: Freeze backend
        shell: bash
        run: |
          uv pip install --python app/backend/.venv pyinstaller==6.20.0
          uv run --project app/backend --frozen python app/scripts/freeze-backend.py
      - name: Exercise packaged offline backend
        shell: bash
        run: uv run --project app/backend --frozen python app/scripts/smoke-frozen.py app/resources
      - name: Exercise bundled host lifecycle without a system Node
        run: uv run --project app/backend --frozen python app/scripts/smoke-plugin-runtime.py app/resources
      - run: pnpm test:shell
        working-directory: app
      - name: Check Rust formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
      - name: Build macOS installer without Finder automation
        run: pnpm build:macos
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: momo-${{ inputs.platform }}-candidate
          path: |
            app/src-tauri/target/release/bundle/
          if-no-files-found: error
