name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      # Live2D sample 素材不入库：vitepress build 与 site tests 前先拉取。
      - name: Fetch Hiyori sample assets
        run: ./scripts/fetch-hiyori.sh site/docs/public/live2d/hiyori
      - run: pnpm test
        working-directory: site
      - run: pnpm build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
