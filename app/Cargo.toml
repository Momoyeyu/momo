[package]
name = "momo-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "momo orchestrator (momod) + thin web UI"

[lib]
name = "momo_app"
path = "src/lib.rs"

[[bin]]
name = "momod"
path = "src/main.rs"

# dev-only REPL（打字→TTS→出声），仅在 `--features repl` 下构建
[[bin]]
name = "momo-repl"
path = "src/bin/momo-repl.rs"
required-features = ["repl"]

[features]
repl = ["dep:rodio"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
futures-util = "0.3"
tokio-util = "0.7"
async-trait = "0.1"
bytes = "1"
url = "2"
ulid = { version = "1", features = ["serde"] }
dotenvy = "0.15"
# ws 客户端（orchestrator→模型服务链路）；TLS 一律 rustls（workspace 规则）
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# dev-only REPL 本地扬声器输出（解码特性全部关闭，只用 SamplesBuffer+Sink）
rodio = { version = "0.19", default-features = false, optional = true }
serde_yaml = "0.9.34"
dirs = "6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-channel = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["test-util"] }
# tts client 集成测试的 mock svc-tts（复用与主依赖同版本 axum ws）
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde_json = "1"
tokio-util = "0.7"
ulid = "1"
