[package]
name = "momo-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "momo desktop shell (Tauri)：透明 companion 窗口 + tray + momod 生命周期"

[[bin]]
name = "momo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5" }

[dependencies]
# macos-private-api：macOS 上 transparent 窗口必需（tauri cfg gate）
tauri = { version = "2.9", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.3"
tauri-plugin-window-state = "2.3"
serde_json = "1"
getrandom = "0.3"
