[package]
name = "momo-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "momo desktop shell and owned Python runtime"
license = "MIT"

[[bin]]
name = "momo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5" }

[features]
native-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2.9", features = [] }
tauri-plugin-single-instance = "2.3"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
