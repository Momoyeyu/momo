<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>momo</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="chat"></div>
      <form id="composer">
        <input id="composer-input" type="text" autocomplete="off" placeholder="Say something…" />
        <button id="composer-send" type="submit">Send</button>
        <button id="mic" type="button">Hold to talk</button>
      </form>
      <div id="status">Connecting…</div>
      <div id="avatar-fallback" hidden role="alert"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
