<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f472a8' d='M12 21s-7.5-4.9-9.7-9.2C.7 8.6 2.4 5 5.7 5c1.9 0 3.3 1 4.1 2.3l2.2 3.2 2.2-3.2C15 6 16.4 5 18.3 5c3.3 0 5 3.6 3.4 6.8C19.5 16.1 12 21 12 21z'/%3E%3C/svg%3E"
    />
    <title>momo</title>
  </head>
    <div id="app">
      <!-- 舞台层：房间背景 + 氛围（vignette/聚光/接触影/漂浮粒子），Live2D canvas 透明叠加 -->
      <div id="stage-bg" aria-hidden="true"></div>
      <div id="stage-vignette" aria-hidden="true"></div>
      <div id="stage-spotlight" aria-hidden="true"></div>
      <div id="stage-shadow" aria-hidden="true"></div>
      <div id="stage-particles" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <canvas id="stage"></canvas>

      <!-- 对话框：字幕控制器驱动（#147），名牌 + 逐字文本 + 续行提示 -->
      <div id="subtitle" hidden>
        <div id="subtitle-name">momo</div>
        <p id="subtitle-text"></p>
        <span id="subtitle-next" aria-hidden="true"></span>
      </div>

      <div id="status">Connecting…</div>
      <div id="avatar-fallback" hidden role="alert"></div>

      <button id="chat-toggle" type="button" aria-label="切换聊天面板">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
        </svg>
      </button>

      <aside id="chat-panel">
        <header id="chat-header">
          <svg class="chat-header-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M12 21s-7.5-4.9-9.7-9.2C.7 8.6 2.4 5 5.7 5c1.9 0 3.3 1 4.1 2.3l2.2 3.2 2.2-3.2C15 6 16.4 5 18.3 5c3.3 0 5 3.6 3.4 6.8C19.5 16.1 12 21 12 21z" />
          </svg>
          <div class="chat-header-text">
            <h1>momo 聊天室</h1>
            <p>live chat</p>
          </div>
        </header>
        <div id="chat"></div>
        <form id="composer">
          <input id="composer-input" type="text" autocomplete="off" placeholder="和 momo 说点什么…" />
          <button id="composer-send" type="submit" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13" />
              <path d="M22 2 15 22l-4-9-9-4 20-7z" />
            </svg>
          </button>
          <button id="mic" type="button" aria-label="按住说话">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 10a7 7 0 0 0 14 0" />
              <path d="M12 17v4" />
            </svg>
          </button>
        </form>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
