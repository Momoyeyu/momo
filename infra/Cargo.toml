[package]
name = "momo-infra"
version = "0.1.0"
edition = "2021"
description = "momo 运维 CLI：doctor / pull / serve / switch / bench / gc / config"

[lib]
name = "momo_infra"
path = "src/lib.rs"

[[bin]]
name = "momoctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"
dotenvy = "0.15"
owo-colors = "4"
sha2 = "0.10"

# 进程探活/信号走 syscall（serve/proc.rs），不 spawn 外部 kill/ps。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 进程探活/强杀走 Win32 API（serve/proc.rs），不 spawn tasklist/taskkill。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
