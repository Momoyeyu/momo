# MANIFEST.toml —— 模型下载清单（口径见 src/momo_models/manifest.py 与
# momo-docs/02-repos/momo-models.md「模型目录布局与下载清单」）。
#
# 权重实体在 $MOMO_MODELS_DIR（默认 ~/.cache/momo/models，不入库），
# dest 镜像 <owner>/<repo> 布局。下载与校验由 momo-infra `momoctl pull` 执行；
# 运行时 provider 只读本地路径，sha256 校验不过 → readyz 拒绝就绪。
#
# TODO：所有 sha256 为占位（"TODO"），`momoctl pull` 实装前按 hf-mirror 实际文件补齐。

