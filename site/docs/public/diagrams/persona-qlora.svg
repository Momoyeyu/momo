<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="inherit">
  <defs>
    <marker id="pq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b84a8"/>
    </marker>
    <marker id="pq-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e0678c"/>
    </marker>
  </defs>

  <!-- lanes -->
  <g font-size="11" class="dg-region-label">
    <text x="24" y="82">① 人格定义 (P0-P2)</text>
    <text x="24" y="172">② 数据攒集</text>
    <text x="24" y="262">③ QLoRA 训练 (P3+)</text>
    <text x="24" y="352">④ 回归评测</text>
  </g>
  <g class="dg-stroke" stroke-width="1" opacity="0.35">
    <line x1="24" y1="112" x2="936" y2="112"/>
    <line x1="24" y1="202" x2="936" y2="202"/>
    <line x1="24" y1="292" x2="936" y2="292"/>
  </g>

  <!-- lane 1 -->
  <rect x="40" y="50" width="150" height="56" rx="11" fill="#f7a8c4" stroke="#3d3455" stroke-width="2"/>
  <text x="115" y="74" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">persona.yaml</text>
  <text x="115" y="92" text-anchor="middle" font-size="9.5" class="dg-node-text">character card 单一事实来源</text>

  <rect x="240" y="50" width="160" height="56" rx="11" fill="#f9d77e" stroke="#3d3455" stroke-width="2"/>
  <text x="320" y="74" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">system prompt 组装</text>
  <text x="320" y="92" text-anchor="middle" font-size="9.5" class="dg-node-text">记忆 / 情境注入</text>

  <rect x="450" y="50" width="150" height="56" rx="11" fill="#8fd8c9" stroke="#3d3455" stroke-width="2"/>
  <text x="525" y="74" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">日常会话</text>
  <text x="525" y="92" text-anchor="middle" font-size="9.5" class="dg-node-text">8 情感 tag 对齐协议</text>

  <!-- lane 2 -->
  <rect x="240" y="140" width="160" height="56" rx="11" fill="#a5c8ff" stroke="#3d3455" stroke-width="2"/>
  <text x="320" y="164" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">会话采集</text>
  <text x="320" y="182" text-anchor="middle" font-size="9.5" class="dg-node-text">脱敏入库</text>

  <rect x="450" y="140" width="150" height="56" rx="11" fill="#a78bfa" stroke="#3d3455" stroke-width="2"/>
  <text x="525" y="164" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">人工修写</text>
  <text x="525" y="182" text-anchor="middle" font-size="9.5" class="dg-node-text">改不符人设回复 · 金标准</text>

  <rect x="650" y="140" width="160" height="56" rx="11" fill="#f9c7a0" stroke="#3d3455" stroke-width="2"/>
  <text x="730" y="164" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">SFT 数据集</text>
  <text x="730" y="182" text-anchor="middle" font-size="9.5" class="dg-node-text">JSONL · 数百条起步</text>

  <!-- lane 3 -->
  <rect x="450" y="230" width="170" height="56" rx="11" fill="#f2a0b5" stroke="#3d3455" stroke-width="2"/>
  <text x="535" y="254" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">QLoRA 微调</text>
  <text x="535" y="272" text-anchor="middle" font-size="9.5" class="dg-node-text">8-14B · 4090D ≤24h · models/</text>

  <rect x="680" y="230" width="170" height="56" rx="11" fill="#b5e3c4" stroke="#3d3455" stroke-width="2"/>
  <text x="765" y="254" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">LoRA 挂载灰度</text>
  <text x="765" y="272" text-anchor="middle" font-size="9.5" class="dg-node-text">回归通过后上线 · 可回滚</text>

  <!-- lane 4 -->
  <rect x="450" y="320" width="190" height="56" rx="11" fill="#f9d77e" stroke="#3d3455" stroke-width="2"/>
  <text x="545" y="344" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">20 题评测集</text>
  <text x="545" y="362" text-anchor="middle" font-size="9.5" class="dg-node-text">固定回归 · 不达标回改 card</text>

  <!-- edges -->
  <line x1="190" y1="78" x2="236" y2="78" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <line x1="400" y1="78" x2="446" y2="78" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <path d="M525 106 C 480 118, 400 122, 340 136" fill="none" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <line x1="400" y1="168" x2="446" y2="168" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <line x1="600" y1="168" x2="646" y2="168" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <path d="M730 196 C 690 215, 610 220, 560 228" fill="none" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <line x1="620" y1="258" x2="676" y2="258" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <path d="M535 286 C 540 300, 543 310, 545 316" fill="none" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <path d="M640 348 C 760 360, 800 330, 780 290" fill="none" class="dg-stroke" stroke-width="1.8" marker-end="url(#pq-arr)"/>
  <text x="800" y="322" text-anchor="middle" font-size="9.5" class="dg-sub">达标 → 上线</text>
  <path d="M450 348 C 240 360, 120 300, 115 110" fill="none" stroke="#e0678c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#pq-arr-r)"/>
  <text x="240" y="330" text-anchor="middle" font-size="9.5" fill="#e0678c">不达标 → 回改 character card</text>
</svg>
