<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="inherit">
  <defs>
    <marker id="sm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b84a8"/>
    </marker>
  </defs>

  <!-- ===== runtime data path ===== -->
  <rect x="16" y="16" width="700" height="300" rx="16" class="dg-region" stroke-width="1.6"/>
  <text x="36" y="42" font-size="12.5" class="dg-region-label">运行时数据通路（momo-ws v1 + OpenAI HTTP）</text>

  <!-- user -->
  <rect x="36" y="150" width="104" height="72" rx="12" fill="#8fd8c9" stroke="#3d3455" stroke-width="2"/>
  <text x="88" y="180" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">用户</text>
  <text x="88" y="200" text-anchor="middle" font-size="10.5" class="dg-node-text">文字 / 语音</text>

  <!-- action provider -->
  <rect x="36" y="52" width="130" height="60" rx="12" fill="#a5c8ff" stroke="#3d3455" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="101" y="76" text-anchor="middle" font-size="12.5" font-weight="700" class="dg-node-text">action 提供方</text>
  <text x="101" y="94" text-anchor="middle" font-size="10.5" class="dg-node-text">游戏 / 工具 (P4)</text>

  <!-- ui -->
  <rect x="196" y="140" width="170" height="92" rx="12" fill="#f7a8c4" stroke="#3d3455" stroke-width="2"/>
  <text x="281" y="170" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">交互端</text>
  <text x="281" y="190" text-anchor="middle" font-size="10.5" class="dg-node-text">浏览器 · Live2D + 音频 IO</text>
  <text x="281" y="208" text-anchor="middle" font-size="10" class="dg-node-text" opacity="0.75">app/ (TS)</text>

  <!-- momod -->
  <rect x="430" y="140" width="180" height="92" rx="12" fill="#a78bfa" stroke="#3d3455" stroke-width="2"/>
  <text x="520" y="170" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">momod 编排器</text>
  <text x="520" y="190" text-anchor="middle" font-size="10.5" class="dg-node-text">回合状态机 · 打断 · 句切</text>
  <text x="520" y="208" text-anchor="middle" font-size="10" class="dg-node-text" opacity="0.75">Rust · axum :7800</text>

  <!-- model services -->
  <rect x="760" y="52" width="204" height="66" rx="12" fill="#b5e3c4" stroke="#3d3455" stroke-width="2"/>
  <text x="862" y="76" text-anchor="middle" font-size="13" font-weight="700" class="dg-node-text">ASR 服务</text>
  <text x="862" y="94" text-anchor="middle" font-size="10.5" class="dg-node-text">SenseVoice + silero-vad · :7810 纯CPU</text>

  <rect x="760" y="140" width="204" height="66" rx="12" fill="#f9d77e" stroke="#3d3455" stroke-width="2"/>
  <text x="862" y="164" text-anchor="middle" font-size="13" font-weight="700" class="dg-node-text">TTS 服务</text>
  <text x="862" y="182" text-anchor="middle" font-size="10.5" class="dg-node-text">CosyVoice3 / Kokoro · :7811 CUDA</text>

  <rect x="760" y="228" width="204" height="66" rx="12" fill="#f9c7a0" stroke="#3d3455" stroke-width="2"/>
  <text x="862" y="252" text-anchor="middle" font-size="13" font-weight="700" class="dg-node-text">大脑 LLM</text>
  <text x="862" y="270" text-anchor="middle" font-size="10.5" class="dg-node-text">Qwen3-30B-A3B · MLX :7820 · 121t/s</text>

  <!-- runtime edges -->
  <line x1="140" y1="186" x2="192" y2="186" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="166" y="176" text-anchor="middle" font-size="10.5" class="dg-sub">打字 / 说话</text>

  <path d="M166 82 C 260 60, 340 90, 424 140" fill="none" class="dg-stroke dg-dash" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="300" y="72" text-anchor="middle" font-size="10.5" class="dg-sub">/ws/action</text>

  <line x1="366" y1="186" x2="426" y2="186" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)" marker-start="url(#sm-arr)"/>
  <text x="396" y="176" text-anchor="middle" font-size="10.5" class="dg-sub">/ws/ui</text>

  <path d="M610 160 C 680 120, 700 100, 756 88" fill="none" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="680" y="96" text-anchor="middle" font-size="10.5" class="dg-sub">音频上行 + 转写</text>

  <line x1="610" y1="180" x2="756" y2="174" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="682" y="166" text-anchor="middle" font-size="10.5" class="dg-sub">逐句合成下行</text>

  <path d="M610 212 C 680 240, 700 252, 756 260" fill="none" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="682" y="246" text-anchor="middle" font-size="10.5" class="dg-sub">SSE 流式</text>

  <!-- fallback brains (outside region) -->
  <rect x="760" y="344" width="204" height="56" rx="12" fill="#d9d3e8" stroke="#3d3455" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="862" y="368" text-anchor="middle" font-size="12.5" font-weight="700" class="dg-node-text">DeepSeek API</text>
  <text x="862" y="386" text-anchor="middle" font-size="10.5" class="dg-node-text">兜底 / 对照</text>

  <rect x="540" y="344" width="200" height="56" rx="12" fill="#d9d3e8" stroke="#3d3455" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="640" y="368" text-anchor="middle" font-size="12.5" font-weight="700" class="dg-node-text">bigstrong vLLM</text>
  <text x="640" y="386" text-anchor="middle" font-size="10.5" class="dg-node-text">借用 · 夜间窗口</text>

  <path d="M610 232 C 620 290, 620 320, 636 340" fill="none" class="dg-stroke dg-dash" stroke-width="2" marker-end="url(#sm-arr)"/>
  <path d="M700 300 C 760 320, 800 330, 840 342" fill="none" class="dg-stroke dg-dash" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="600" y="330" text-anchor="middle" font-size="10" class="dg-sub">备选 endpoint</text>

  <!-- ===== ops plane ===== -->
  <rect x="16" y="430" width="948" height="172" rx="16" class="dg-region" stroke-width="1.6"/>
  <text x="36" y="456" font-size="12.5" class="dg-region-label">运维面（旁路，不在数据通路上）</text>

  <rect x="36" y="478" width="160" height="80" rx="12" fill="#a5c8ff" stroke="#3d3455" stroke-width="2"/>
  <text x="116" y="508" text-anchor="middle" font-size="13" font-weight="700" class="dg-node-text">momoctl web</text>
  <text x="116" y="526" text-anchor="middle" font-size="10.5" class="dg-node-text">运维控制台 (P2)</text>
  <text x="116" y="544" text-anchor="middle" font-size="10" class="dg-node-text" opacity="0.75">REST + SPA</text>

  <rect x="260" y="478" width="190" height="80" rx="12" fill="#8fd8c9" stroke="#3d3455" stroke-width="2"/>
  <text x="355" y="508" text-anchor="middle" font-size="13" font-weight="700" class="dg-node-text">momoctl</text>
  <text x="355" y="526" text-anchor="middle" font-size="10.5" class="dg-node-text">doctor · serve · pull · jobs</text>
  <text x="355" y="544" text-anchor="middle" font-size="10" class="dg-node-text" opacity="0.75">Rust CLI</text>

  <rect x="520" y="478" width="180" height="80" rx="12" fill="#f9c7a0" stroke="#3d3455" stroke-width="2"/>
  <text x="610" y="508" text-anchor="middle" font-size="13" font-weight="700" class="dg-node-text">模型仓</text>
  <text x="610" y="526" text-anchor="middle" font-size="10.5" class="dg-node-text">$MOMO_MODELS_DIR</text>
  <text x="610" y="544" text-anchor="middle" font-size="10" class="dg-node-text" opacity="0.75">MANIFEST + sha256</text>

  <rect x="776" y="478" width="180" height="80" rx="12" fill="#f7a8c4" stroke="#3d3455" stroke-width="2"/>
  <text x="866" y="508" text-anchor="middle" font-size="13" font-weight="700" class="dg-node-text">4090D 训练机</text>
  <text x="866" y="526" text-anchor="middle" font-size="10.5" class="dg-node-text">学校云 · ≤24h burst</text>
  <text x="866" y="544" text-anchor="middle" font-size="10" class="dg-node-text" opacity="0.75">exec_ssh</text>

  <line x1="196" y1="518" x2="256" y2="518" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)" marker-start="url(#sm-arr)"/>
  <text x="226" y="508" text-anchor="middle" font-size="10" class="dg-sub">共用核心</text>

  <line x1="450" y1="518" x2="516" y2="518" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="483" y="508" text-anchor="middle" font-size="10" class="dg-sub">pull / 激活</text>

  <line x1="776" y1="518" x2="704" y2="518" class="dg-stroke" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="740" y="508" text-anchor="middle" font-size="10" class="dg-sub">产物回传</text>

  <!-- momoctl -> momod dashed -->
  <path d="M355 478 C 370 400, 440 320, 490 234" fill="none" class="dg-stroke dg-dash" stroke-width="2" marker-end="url(#sm-arr)"/>
  <text x="400" y="380" text-anchor="middle" font-size="10" class="dg-sub">serve / env / 状态</text>
</svg>
