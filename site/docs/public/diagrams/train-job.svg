<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="inherit">
  <defs>
    <marker id="tj-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b84a8"/>
    </marker>
    <marker id="tj-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e0678c"/>
    </marker>
  </defs>

  <!-- lanes -->
  <g font-size="11" class="dg-region-label">
    <text x="24" y="92">job 推进</text>
    <text x="24" y="196">执行器</text>
    <text x="24" y="300">终态</text>
  </g>
  <g class="dg-stroke" stroke-width="1" opacity="0.35">
    <line x1="24" y1="132" x2="936" y2="132"/>
    <line x1="24" y1="236" x2="936" y2="236"/>
  </g>

  <!-- main lane -->
  <rect x="50" y="60" width="140" height="62" rx="11" fill="#d9d3e8" stroke="#3d3455" stroke-width="2"/>
  <text x="120" y="86" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">Queued</text>
  <text x="120" y="104" text-anchor="middle" font-size="9.5" class="dg-node-text">POST /api/jobs · job.json</text>

  <rect x="240" y="60" width="140" height="62" rx="11" fill="#a5c8ff" stroke="#3d3455" stroke-width="2"/>
  <text x="310" y="86" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">Preparing</text>
  <text x="310" y="104" text-anchor="middle" font-size="9.5" class="dg-node-text">数据集校验 / 切片</text>

  <rect x="430" y="60" width="150" height="62" rx="11" fill="#f9c7a0" stroke="#3d3455" stroke-width="2"/>
  <text x="505" y="86" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">Running</text>
  <text x="505" y="104" text-anchor="middle" font-size="9.5" class="dg-node-text">日志 SSE · ckpt 每 2h</text>

  <rect x="630" y="60" width="140" height="62" rx="11" fill="#8fd8c9" stroke="#3d3455" stroke-width="2"/>
  <text x="700" y="86" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">Succeeded</text>
  <text x="700" y="104" text-anchor="middle" font-size="9.5" class="dg-node-text">exit 0 + 产物校验</text>

  <rect x="820" y="60" width="120" height="62" rx="11" fill="#b5e3c4" stroke="#3d3455" stroke-width="2"/>
  <text x="880" y="86" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">Promoted</text>
  <text x="880" y="104" text-anchor="middle" font-size="9.5" class="dg-node-text">MANIFEST 激活 · 可回滚</text>

  <!-- exec lane -->
  <rect x="360" y="160" width="160" height="62" rx="11" fill="#f7a8c4" stroke="#3d3455" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="186" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">exec_local</text>
  <text x="440" y="204" text-anchor="middle" font-size="9.5" class="dg-node-text">本地子进程 · pidfile · 日志落盘</text>

  <rect x="560" y="160" width="170" height="62" rx="11" fill="#f7a8c4" stroke="#3d3455" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="645" y="186" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">exec_ssh</text>
  <text x="645" y="204" text-anchor="middle" font-size="9.5" class="dg-node-text">4090D / mac-studio · rsync 回传</text>

  <!-- terminal lane -->
  <rect x="360" y="266" width="140" height="62" rx="11" fill="#f2a0b5" stroke="#3d3455" stroke-width="2"/>
  <text x="430" y="292" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">Failed</text>
  <text x="430" y="310" text-anchor="middle" font-size="9.5" class="dg-node-text">exit≠0 / 日志异常 · 可 retry</text>

  <rect x="560" y="266" width="140" height="62" rx="11" fill="#f2a0b5" stroke="#3d3455" stroke-width="2"/>
  <text x="630" y="292" text-anchor="middle" font-size="12" font-weight="700" class="dg-node-text">Canceled</text>
  <text x="630" y="310" text-anchor="middle" font-size="9.5" class="dg-node-text">POST cancel · 可 retry</text>

  <!-- edges -->
  <line x1="190" y1="91" x2="236" y2="91" class="dg-stroke" stroke-width="1.8" marker-end="url(#tj-arr)"/>
  <line x1="380" y1="91" x2="426" y2="91" class="dg-stroke" stroke-width="1.8" marker-end="url(#tj-arr)"/>
  <text x="403" y="80" text-anchor="middle" font-size="9" class="dg-sub">launch</text>
  <line x1="580" y1="91" x2="626" y2="91" class="dg-stroke" stroke-width="1.8" marker-end="url(#tj-arr)"/>
  <text x="603" y="80" text-anchor="middle" font-size="9" class="dg-sub">exit 0</text>
  <line x1="770" y1="91" x2="816" y2="91" class="dg-stroke" stroke-width="1.8" marker-end="url(#tj-arr)"/>
  <text x="793" y="80" text-anchor="middle" font-size="9" class="dg-sub">盲听/回归达标</text>

  <path d="M480 122 C 470 135, 458 148, 450 156" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#tj-arr)"/>
  <path d="M540 122 C 575 135, 605 148, 630 158" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#tj-arr)"/>

  <path d="M490 122 C 470 180, 450 220, 438 262" fill="none" stroke="#e0678c" stroke-width="1.8" marker-end="url(#tj-arr-r)"/>
  <path d="M545 122 C 580 180, 610 220, 622 262" fill="none" stroke="#e0678c" stroke-width="1.8" marker-end="url(#tj-arr-r)"/>

  <path d="M430 328 C 300 350, 140 340, 122 126" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#tj-arr)"/>
  <path d="M630 328 C 500 356, 160 352, 120 126" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#tj-arr)"/>
  <text x="260" y="345" text-anchor="middle" font-size="9.5" class="dg-sub">retry</text>

  <!-- side note -->
  <rect x="770" y="160" width="176" height="62" rx="11" fill="none" class="dg-stroke dg-dash" stroke-width="1.5"/>
  <text x="858" y="182" text-anchor="middle" font-size="10.5" font-weight="600" class="dg-label">job store 持久化</text>
  <text x="858" y="200" text-anchor="middle" font-size="9.5" class="dg-sub">jobs/&lt;id&gt;/{job.json,logs,artifacts} · 重启恢复</text>
  <rect x="770" y="266" width="176" height="62" rx="11" fill="none" class="dg-stroke dg-dash" stroke-width="1.5"/>
  <text x="858" y="288" text-anchor="middle" font-size="10.5" font-weight="600" class="dg-label">借用窗口</text>
  <text x="858" y="306" text-anchor="middle" font-size="9.5" class="dg-sub">borrowed_night_only 只在窗口调度</text>
</svg>
