<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="inherit">
  <defs>
    <marker id="ts-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b84a8"/>
    </marker>
    <marker id="ts-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e0678c"/>
    </marker>
  </defs>

  <text x="30" y="60" font-size="12" class="dg-region-label">回合主推进</text>
  <text x="30" y="300" font-size="12" class="dg-region-label">打断路径</text>
  <line x1="30" y1="215" x2="870" y2="215" class="dg-stroke dg-dash" stroke-width="1.4" opacity="0.6"/>

  <!-- states -->
  <rect x="60" y="90" width="130" height="80" rx="12" fill="#d9d3e8" stroke="#3d3455" stroke-width="2"/>
  <text x="125" y="120" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">Idle</text>
  <text x="125" y="140" text-anchor="middle" font-size="10" class="dg-node-text">重置 idle 计时器</text>
  <text x="125" y="157" text-anchor="middle" font-size="9.5" class="dg-node-text" opacity="0.7">等待输入</text>

  <rect x="240" y="90" width="130" height="80" rx="12" fill="#8fd8c9" stroke="#3d3455" stroke-width="2"/>
  <text x="305" y="120" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">Listening</text>
  <text x="305" y="140" text-anchor="middle" font-size="10" class="dg-node-text">绑定 turn_id · 收音频</text>
  <text x="305" y="157" text-anchor="middle" font-size="9.5" class="dg-node-text" opacity="0.7">VAD 分段</text>

  <rect x="420" y="90" width="130" height="80" rx="12" fill="#f9c7a0" stroke="#3d3455" stroke-width="2"/>
  <text x="485" y="120" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">Thinking</text>
  <text x="485" y="140" text-anchor="middle" font-size="10" class="dg-node-text">组历史+人设 · 起 LLM 流</text>
  <text x="485" y="157" text-anchor="middle" font-size="9.5" class="dg-node-text" opacity="0.7">取消令牌</text>

  <rect x="600" y="90" width="130" height="80" rx="12" fill="#f7a8c4" stroke="#3d3455" stroke-width="2"/>
  <text x="665" y="120" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">Speaking</text>
  <text x="665" y="140" text-anchor="middle" font-size="10" class="dg-node-text">句切 → 双发 UI+TTS</text>
  <text x="665" y="157" text-anchor="middle" font-size="9.5" class="dg-node-text" opacity="0.7">逐句播报</text>

  <rect x="500" y="250" width="170" height="80" rx="12" fill="#f2a0b5" stroke="#3d3455" stroke-width="2"/>
  <text x="585" y="280" text-anchor="middle" font-size="13.5" font-weight="700" class="dg-node-text">Interrupted</text>
  <text x="585" y="300" text-anchor="middle" font-size="10" class="dg-node-text">barge-in 三动作 · 幂等</text>

  <!-- main flow -->
  <line x1="190" y1="130" x2="236" y2="130" class="dg-stroke" stroke-width="2" marker-end="url(#ts-arr)"/>
  <text x="213" y="118" text-anchor="middle" font-size="9.5" class="dg-sub">text / VAD</text>
  <line x1="370" y1="130" x2="416" y2="130" class="dg-stroke" stroke-width="2" marker-end="url(#ts-arr)"/>
  <text x="393" y="118" text-anchor="middle" font-size="9.5" class="dg-sub">segment final</text>
  <line x1="550" y1="130" x2="596" y2="130" class="dg-stroke" stroke-width="2" marker-end="url(#ts-arr)"/>
  <text x="573" y="118" text-anchor="middle" font-size="9.5" class="dg-sub">首句</text>

  <!-- returns over the top -->
  <path d="M305 90 C 305 40, 125 40, 125 86" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#ts-arr)"/>
  <text x="215" y="38" text-anchor="middle" font-size="9.5" class="dg-sub">空段 / 误触发</text>

  <path d="M485 90 C 400 18, 220 18, 130 86" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#ts-arr)"/>
  <text x="300" y="24" text-anchor="middle" font-size="9.5" class="dg-sub">空回复 / 失败</text>

  <path d="M665 90 C 560 8, 240 8, 128 84" fill="none" class="dg-stroke" stroke-width="2" marker-end="url(#ts-arr)"/>
  <text x="400" y="14" text-anchor="middle" font-size="9.5" class="dg-sub">final 句播完</text>

  <!-- spontaneous -->
  <path d="M160 170 C 200 210, 380 220, 480 172" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#ts-arr)"/>
  <text x="300" y="208" text-anchor="middle" font-size="9.5" class="dg-sub">idle 超时自发开口（≤1次/连续）</text>

  <!-- barge-in -->
  <path d="M485 170 C 500 200, 530 225, 560 248" fill="none" stroke="#e0678c" stroke-width="2" marker-end="url(#ts-arr-r)"/>
  <path d="M665 170 C 660 200, 640 225, 615 248" fill="none" stroke="#e0678c" stroke-width="2" marker-end="url(#ts-arr-r)"/>
  <text x="520" y="215" text-anchor="middle" font-size="9.5" fill="#e0678c">barge-in</text>
  <text x="648" y="215" text-anchor="middle" font-size="9.5" fill="#e0678c">barge-in</text>

  <!-- back from interrupted -->
  <path d="M500 290 C 380 300, 300 260, 305 174" fill="none" class="dg-stroke" stroke-width="2.2" marker-end="url(#ts-arr)"/>
  <text x="380" y="280" text-anchor="middle" font-size="9.5" class="dg-sub">新输入继续（记账完成后）</text>

  <path d="M585 330 C 400 356, 130 340, 125 174" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#ts-arr)"/>
  <text x="350" y="345" text-anchor="middle" font-size="9.5" class="dg-sub">无后续输入</text>

  <!-- side note -->
  <rect x="760" y="240" width="120" height="90" rx="12" fill="none" class="dg-stroke dg-dash" stroke-width="1.5"/>
  <text x="820" y="264" text-anchor="middle" font-size="10.5" font-weight="600" class="dg-label">打断语义</text>
  <text x="820" y="284" text-anchor="middle" font-size="9.5" class="dg-sub">两态皆可打断</text>
  <text x="820" y="300" text-anchor="middle" font-size="9.5" class="dg-sub">记账完成才回听</text>
  <text x="820" y="316" text-anchor="middle" font-size="9.5" class="dg-sub">新回合新令牌</text>
</svg>
