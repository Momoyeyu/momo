<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="inherit">
  <defs>
    <marker id="vc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b84a8"/>
    </marker>
  </defs>

  <!-- lanes -->
  <g font-size="11" class="dg-region-label">
    <text x="24" y="82">① 素材</text>
    <text x="24" y="172">② 零样本评估</text>
    <text x="24" y="262">③ SFT 微调</text>
    <text x="24" y="352">④ 部署切换</text>
  </g>
  <g class="dg-stroke" stroke-width="1" opacity="0.35">
    <line x1="24" y1="112" x2="936" y2="112"/>
    <line x1="24" y1="202" x2="936" y2="202"/>
    <line x1="24" y1="292" x2="936" y2="292"/>
  </g>

  <!-- lane 1: material -->
  <rect x="40" y="50" width="150" height="56" rx="11" fill="#f7a8c4" stroke="#3d3455" stroke-width="2"/>
  <text x="115" y="74" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">声线素材</text>
  <text x="115" y="92" text-anchor="middle" font-size="9.5" class="dg-node-text">T0 30s / T2 10-60min</text>

  <rect x="240" y="50" width="160" height="56" rx="11" fill="#f9d77e" stroke="#3d3455" stroke-width="2"/>
  <text x="320" y="74" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">质量门槛</text>
  <text x="320" y="92" text-anchor="middle" font-size="9.5" class="dg-node-text">单人声·无BGM·≥24kHz·授权</text>

  <!-- lane 2: zero-shot eval -->
  <rect x="450" y="140" width="160" height="56" rx="11" fill="#a5c8ff" stroke="#3d3455" stroke-width="2"/>
  <text x="530" y="164" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">零样本试听</text>
  <text x="530" y="182" text-anchor="middle" font-size="9.5" class="dg-node-text">3基座 × 3参考音 × 15句</text>

  <rect x="660" y="140" width="160" height="56" rx="11" fill="#a78bfa" stroke="#3d3455" stroke-width="2"/>
  <text x="740" y="164" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">盲听 A/B</text>
  <text x="740" y="182" text-anchor="middle" font-size="9.5" class="dg-node-text">≥2人 · 加权分 ≥3.5 达标</text>

  <!-- lane 3: sft -->
  <rect x="240" y="230" width="170" height="56" rx="11" fill="#8fd8c9" stroke="#3d3455" stroke-width="2"/>
  <text x="325" y="254" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">数据集制备</text>
  <text x="325" y="272" text-anchor="middle" font-size="9.5" class="dg-node-text">VAD切片+SenseVoice标注·抽检10%</text>

  <rect x="460" y="230" width="170" height="56" rx="11" fill="#f9c7a0" stroke="#3d3455" stroke-width="2"/>
  <text x="545" y="254" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">CosyVoice3 SFT</text>
  <text x="545" y="272" text-anchor="middle" font-size="9.5" class="dg-node-text">4090D ≤24h · ckpt每2h·留1h回传</text>

  <rect x="680" y="230" width="140" height="56" rx="11" fill="#d9d3e8" stroke="#3d3455" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="750" y="254" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">补素材再训</text>
  <text x="750" y="272" text-anchor="middle" font-size="9.5" class="dg-node-text">复测不达标 → 回素材</text>

  <!-- lane 4: deploy -->
  <rect x="60" y="320" width="170" height="56" rx="11" fill="#d9d3e8" stroke="#3d3455" stroke-width="2"/>
  <text x="145" y="344" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">Kokoro 兜底</text>
  <text x="145" y="362" text-anchor="middle" font-size="9.5" class="dg-node-text">实测首包 209ms（P2 先上线）</text>

  <rect x="450" y="320" width="190" height="56" rx="11" fill="#b5e3c4" stroke="#3d3455" stroke-width="2"/>
  <text x="545" y="344" text-anchor="middle" font-size="11.5" font-weight="700" class="dg-node-text">灰度切默认声线</text>
  <text x="545" y="362" text-anchor="middle" font-size="9.5" class="dg-node-text">只改 env · N-1 可回滚</text>

  <!-- edges -->
  <line x1="190" y1="78" x2="236" y2="78" class="dg-stroke" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <line x1="400" y1="78" x2="468" y2="136" class="dg-stroke" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <line x1="610" y1="168" x2="656" y2="168" class="dg-stroke" stroke-width="1.8" marker-end="url(#vc-arr)"/>

  <path d="M740 196 C 700 250, 600 300, 640 322" fill="none" class="dg-stroke" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <text x="700" y="300" text-anchor="middle" font-size="9.5" class="dg-sub">零样本达标 → 直接切</text>

  <path d="M660 168 C 500 160, 400 190, 350 226" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <text x="490" y="150" text-anchor="middle" font-size="9.5" class="dg-sub">不达标 → 走 SFT</text>

  <line x1="410" y1="258" x2="456" y2="258" class="dg-stroke" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <path d="M545 286 C 545 310, 545 315, 545 316" fill="none" class="dg-stroke" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <text x="600" y="306" text-anchor="middle" font-size="9.5" class="dg-sub">产物回传 + 复测达标</text>

  <line x1="630" y1="258" x2="676" y2="258" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <text x="653" y="248" text-anchor="middle" font-size="9" class="dg-sub">不达标</text>
  <path d="M750 230 C 740 150, 300 130, 125 104" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <text x="430" y="120" text-anchor="middle" font-size="9.5" class="dg-sub">回到素材环节</text>

  <path d="M230 348 C 320 348, 380 348, 446 348" fill="none" class="dg-stroke dg-dash" stroke-width="1.8" marker-end="url(#vc-arr)"/>
  <text x="338" y="338" text-anchor="middle" font-size="9.5" class="dg-sub">过渡方案</text>
</svg>
